# Root compose file — one command brings up the whole stack:
#
#   docker compose up -d --build
#
# receipt-assistant + receipts-postgres (the app + its own DB). Agent
# traces are Claude Code's own session JSONL under the ./claude bind-mount
# below — there is no separate observability stack.

name: receipt-assistant

services:
  # ── Main app database ──────────────────────────────────────────────
  # Dedicated postgres for receipt-assistant.
  receipts-postgres:
    image: docker.io/postgres:17
    container_name: receipts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # The owner (superuser) password. The default is public, and the
      # extraction agent's shell can reach this server: set
      # RECEIPTS_DB_OWNER_PASSWORD in .env. Postgres reads this variable
      # only when the data directory is first created, so on an existing
      # database change the role first (ALTER ROLE postgres PASSWORD …),
      # then the variable — steps in CLAUDE.md, "Rotating the owner
      # password". Hex only: the value is pasted into DATABASE_URL below.
      POSTGRES_PASSWORD: ${RECEIPTS_DB_OWNER_PASSWORD:-postgres}
      POSTGRES_DB: receipts           # auto-created on first boot
      TZ: UTC
      PGTZ: UTC
    volumes:
      # App DB binary state. Bind-mount to a SIBLING dir outside any git repo
      # and outside iCloud — `~/Developer/receipt-assistant-data/postgres/`.
      # Why not inside this repo's data/? Because this repo is public on
      # GitHub and the DB binary contains extracted receipt PII (merchants,
      # amounts, line items). A `.gitignore` mishap or `git add -f` could
      # leak it. Why not in the outer iCloud-synced project? Because
      # iCloud's continuous block-level reupload is hostile to Postgres
      # fsync semantics. Sibling dir is the right side of both lines.
      # Survives OrbStack/Docker resets (host-side).
      - ${HOME}/Developer/receipt-assistant-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receipts"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ── Main app ───────────────────────────────────────────────────────
  receipt-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: receipt-assistant:local
    container_name: receipt-assistant
    depends_on:
      receipts-postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # The SERVER's connection: the role that owns the schema. It is not
      # in either `claude -p` child's environment. The extraction child is
      # spawned with a DATABASE_URL of its own that logs in as a restricted
      # role on the same host and database; the Ask child gets none, and
      # the server runs its SQL as a read-only role (src/claude.ts,
      # src/db/agent-roles.ts). "Not in its environment" is not "cannot
      # find it": see "What this does not bound" in CLAUDE.md.
      DATABASE_URL: postgresql://postgres:${RECEIPTS_DB_OWNER_PASSWORD:-postgres}@receipts-postgres:5432/receipts
      # Passwords for those two roles: `receipts_agent` (extraction and
      # re-extract; may write only the tables and columns the prompts
      # write) and `receipts_ro` (Ask's queries; SELECT only). The server
      # sets them on the roles at every boot and builds its connection
      # strings from them, so changing one is: edit .env, `up -d`. Unset
      # falls back to a built-in development password and a boot warning —
      # set both in .env (`openssl rand -hex 24`).
      RECEIPTS_AGENT_DB_PASSWORD: ${RECEIPTS_AGENT_DB_PASSWORD:-}
      RECEIPTS_RO_DB_PASSWORD: ${RECEIPTS_RO_DB_PASSWORD:-}
      # Tell the `claude` CLI explicitly where its config + credentials live.
      # Matches the Anthropic-official devcontainer convention and pairs with
      # the ./data/claude bind-mount below.
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # Long-lived Claude *setup-token* (Max-subscription quota, ~365d TTL,
      # from personal-vault anthropic/oauth-token fp 632c964f037d — the SAME
      # token OpenClaw uses). This env var is the SOLE auth gate for the
      # in-container `claude -p`: it overrides (and disables self-refresh of)
      # the mounted credentials.json, which is now only an escape-hatch. Must
      # be a *setup-token*, NOT a short-lived access token (that was Era 1's
      # 24h-401 bug). Rotate before ~2027-07-31: `claude setup-token` on mini
      # -> paste into .env -> up -d -> update vault + `openclaw models auth
      # paste-token`. Full rationale in CLAUDE.md 'Claude Code OAuth'.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Google Maps API key. Passed on to the EXTRACTION agent only (its
      # Bash tool uses it for Phase 3 geocoding); the Ask agent does not
      # get it. Also used by the server's own merchant-enrichment loop.
      # Empty is fine — the prompt instructs the agent to skip geocoding.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # Worker concurrency for `claude -p` extraction. PRODUCTION RUNS
      # SERIALIZED (1) ON PURPOSE — this is a correctness setting, not a
      # throughput one. Two documents of the same money event uploaded in
      # one batch cannot see each other while their extractions overlap:
      # neither one's Turn A candidate query finds the other's not-yet-
      # written transaction, so both are booked and the ledger double
      # counts (#225 — two real double counts on 2026-08-19). At 1 the
      # second extraction starts after the first has committed, so the
      # existing ±30-day identifier search finds it and the race is gone.
      # Latency is not the trade it looks like: uploads are fire-and-
      # forget (users photograph and walk away), so N receipts taking
      # N×30-60s instead of N/6 costs nobody anything. DO NOT raise this
      # to speed up an eval — the sandbox (docker-compose.test.yml) keeps
      # 6 for exactly that, on throwaway data where dedup doesn't matter.
      MAX_CLAUDE_CONCURRENCY: ${MAX_CLAUDE_CONCURRENCY:-1}
      # The model both `claude -p` agents run, passed as `--model` and
      # stamped on every row the extraction agent writes
      # (`metadata.extraction.model`, `documents.ocr_model_version`).
      # Unset, the CLI picked its own default and every row said
      # "cli-default", which names no model. claude-sonnet-5 is what that
      # default has resolved to in every production session since
      # 2026-10-08, so pinning it changes no behaviour; it makes the rows
      # say what ran. An override in .env must be a full model id
      # (claude-…), never an alias like `sonnet`: the stamp is the literal
      # string, and an alias moves when the CLI is bumped.
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}
      # Who writes an extraction into the ledger (wave 1). `agent_sql`: the
      # agent does, through psql, as it always has. `server_apply`: the
      # agent hands back a record and the server writes it. Read per run
      # and recorded on `agent_runs.writer`; any other value is logged once
      # and `agent_sql` runs. The default stays `agent_sql` until the A/B
      # passes.
      EXTRACTION_WRITER: ${EXTRACTION_WRITER:-agent_sql}
      # How many times a `server_apply` run may send an invalid record
      # back to the same session (`claude -p --resume`) before the ingest
      # errors. 0–2. Inert under `agent_sql`.
      EXTRACTION_REPAIR_ROUNDS: ${EXTRACTION_REPAIR_ROUNDS:-1}
      # logo.dev API keys for #101 Phase 2 brand-icon acquisition. The
      # secret key (sk_…) authorizes api.logo.dev/search, which Phase 4b
      # uses search-first to avoid the letter-fallback bug (blind GET
      # against img.logo.dev/<anydomain> returns a generated first-letter
      # PNG for unknown domains — silent wrong-icon). It is passed on to
      # the extraction agent only. The publishable key (pk_…) is NOT
      # passed to any agent: no prompt references it — the search response
      # already carries a signed logo URL. Empty is fine — the agent skips
      # the logo.dev tier when the secret key is unset.
      LOGODEV_PUBLISHABLE_KEY: ${LOGODEV_PUBLISHABLE_KEY:-}
      LOGODEV_SECRET_KEY: ${LOGODEV_SECRET_KEY:-}
    volumes:
      # Uploaded receipt images = user content (PII). Lives in the outer
      # project's iCloud-synced docs root, so the user's own receipt corpus
      # syncs across their Macs naturally. NOT in any git repo — outer
      # project's .gitignore covers /data/, and these are never in this repo
      # anyway. If iCloud "Optimize Mac Storage" evicts files, the bind-mount
      # will return errors at read time; pin the dir via Finder → "Keep
      # Downloaded" to prevent that.
      - ${HOME}/Documents/10_Projects/2026_Dev_ReceiptAssistant/data/uploads:/data
      # Claude Code OAuth credentials + session state. Bind-mount to a
      # SIBLING dir outside any git repo and outside iCloud —
      # `~/Developer/receipt-assistant-data/claude/`. NOT inside this
      # public repo (`.credentials.json` is sensitive — keep it far from
      # `git add -f`). NOT a bind of host's `~/.claude/` — that caused
      # rotation collisions in Era 2. Container holds its own independent
      # OAuth session, seeded once via `docker exec -it receipt-assistant
      # claude /login`; the CLI self-refreshes and writes back here.
      # Survives compose down/up and OrbStack resets. See `setup` skill.
      # Also holds every agent run's transcript, projects/-app/<session>.jsonl
      # — the system's only trace store. The image's managed settings keep
      # them permanently (100 years) instead of the CLI's 30-day default (Dockerfile).
      - ${HOME}/Developer/receipt-assistant-data/claude:/home/node/.claude
      # Brand icon assets cache (#101 Phase 2). Each brand_assets row's
      # `local_path` is relative to /data/brand-assets/, structure:
      #   <brand_id>/<tier>/<origin-token>.<ext>
      # SIBLING dir same as postgres / claude — outside git (PII-adjacent
      # via the brands they identify) and outside iCloud (continuous
      # block reupload undermines `UNIQUE (brand_id, content_hash)`
      # dedup semantics on byte-equal re-fetch). On a fresh machine:
      #   mkdir -p ~/Developer/receipt-assistant-data/brand-assets
      - ${HOME}/Developer/receipt-assistant-data/brand-assets:/data/brand-assets
      # Product image assets cache (#159). Each product_assets row's
      # `local_path` is relative to /data/product-assets/, structure:
      #   <product_id>/<tier>/<sha8>.<ext>
      # SIBLING dir same rationale as brand-assets — outside git and
      # outside iCloud. On a fresh machine:
      #   mkdir -p ~/Developer/receipt-assistant-data/product-assets
      - ${HOME}/Developer/receipt-assistant-data/product-assets:/data/product-assets
      # Self-evolution loop — RUNTIME half only. The agent appends one-line
      # PROPOSALS per run to `lessons.proposed.md` here (raw, unvetted,
      # ephemeral until curated). The curated `lessons.md` is NOT here — it
      # is version-controlled (src/ingest/lessons.md, baked into the image)
      # and read from beside the compiled prompt. A human promotes good
      # proposals out of lessons.proposed.md into the repo's lessons.md.
      # SIBLING dir, same rationale as claude / brand-assets: runtime state,
      # outside git and outside iCloud. On a fresh machine:
      #   mkdir -p ~/Developer/receipt-assistant-data/prompt-lessons
      - ${HOME}/Developer/receipt-assistant-data/prompt-lessons:/data/prompt-lessons
    restart: unless-stopped
